name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reusable so deploy.yml can run the same checks as a gate.
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json engines: >=22.12 (electron 44 toolchain).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
        env:
          NODE_ENV: production
