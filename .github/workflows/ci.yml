name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reusable so deploy.yml can run the same checks as a gate.
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # firebase (FCM) + @capacitor/* require Node >= 24.12.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      # next build wants production; NODE_ENV=development makes static
      # prerendering crash (and would ship the wrong bundle).
      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production
